# Non-secret settings. Secrets come only from environment variables / .env.

capital_inr: 100000          # PLACEHOLDER: set your real trading capital before paper/live mode

risk:
  max_loss_per_trade_pct: 1.0    # loss at stop <= this % of capital
  daily_loss_cap_pct: 3.0
  max_consecutive_losses: 2
  max_calls_per_day: 3
  max_open_calls: 2
  no_new_calls_before: "09:30"
  no_new_calls_after: "14:45"
  flatten_alert_at: "15:10"
  stale_data_seconds: 120        # kill switch threshold

recorder:
  interval_seconds: 60
  data_dir: data/recorded

session:
  monitor_start: "09:00"
  monitor_end: "15:35"
  premarket_brief_at: "08:45"
  eod_summary_at: "15:35"

broker:
  name: dhan
  data_only: true
  dhan:
    base_url: https://api.dhan.co/v2
    nifty_security_id: "13"        # NIFTY 50 in IDX_I (per Dhan SDK examples)
    vix_security_id: "21"          # India VIX in IDX_I: VERIFY against Dhan scrip master
    futures_security_id: null      # null = resolve current month from scrip master
    scrip_master_url: https://images.dhan.co/api-data/api-scrip-master.csv
    timeout_seconds: 10
    max_retries: 3
    quote_min_interval_seconds: 1.0    # Dhan market-quote limit: 1 request/second
    chain_min_interval_seconds: 3.0    # Dhan option-chain limit: 1 request/3 seconds
    history_min_interval_seconds: 0.5

order_placement:
  enabled: false               # never enable without explicit owner approval

telegram:
  max_messages_per_minute: 20
  request_timeout_seconds: 10

news:
  llm_scorer_enabled: false    # free sources + local FinBERT only
  watch_start: "08:00"
  watch_end: "15:35"
  alert_impacts: [high]        # which impact levels are pushed to Telegram immediately
  brief_news_hours: 16         # news window for the 08:45 brief

flows:
  participant_oi_enabled: true # NSE official daily archive file
  fii_dii_enabled: false       # NSE website API; NSE terms restrict automated access. Use `nifbot flows-add` instead, or enable at your own discretion.

storage:
  sqlite_path: data/nifbot.sqlite3
  parquet_dir: data/parquet

logging:
  dir: logs
  level: INFO
  max_bytes: 5000000
  backup_count: 10
