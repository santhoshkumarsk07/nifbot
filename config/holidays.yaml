# NSE equity-derivatives trading holidays (weekdays only).
# A year that is missing here makes the calendar check FAIL (kill switch), by design.
# verified: set to true only after checking against the official NSE circular.
years:
  2026:
    verified: false
    source: "Secondary sources (brokers/news) pending check against the NSE holiday circular"
    holidays:
      - {date: 2026-01-26, name: Republic Day}
      - {date: 2026-03-03, name: Holi}
      - {date: 2026-03-26, name: Shri Ram Navami}
      - {date: 2026-03-31, name: Shri Mahavir Jayanti}
      - {date: 2026-04-03, name: Good Friday}
      - {date: 2026-04-14, name: Dr. Baba Saheb Ambedkar Jayanti}
      - {date: 2026-05-01, name: Maharashtra Day}
      - {date: 2026-05-28, name: Bakri Id}
      - {date: 2026-06-26, name: Moharram}
      - {date: 2026-09-14, name: Ganesh Chaturthi}
      - {date: 2026-10-02, name: Mahatma Gandhi Jayanti}
      - {date: 2026-10-20, name: Dussehra}
      - {date: 2026-11-10, name: Diwali Balipratipada}
      - {date: 2026-11-24, name: Guru Nanak Jayanti}
      - {date: 2026-12-25, name: Christmas}
    special_sessions:
      # Muhurat trading: timings come in a separate NSE circular; no calls are sent in it.
      - {date: 2026-11-08, name: Muhurat Trading (Diwali Laxmi Pujan)}
