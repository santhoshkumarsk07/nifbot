[project]
name = "nifbot"
version = "0.1.0"
description = "Semi-automatic Nifty 50 options assistant: signals and Telegram alerts only, no order placement."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "defusedxml>=0.7.1",
    "httpx>=0.27",
    "pandas>=2.2",
    "pyarrow>=17",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0.1",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
# Local FinBERT sentiment. Large download (PyTorch); without it a lexicon scorer is used.
nlp = [
    "torch>=2.3",
    "transformers>=4.44",
]

[dependency-groups]
dev = [
    "bandit>=1.7.9",
    "mypy>=1.10",
    "pandas-stubs>=2.2",
    "pip-audit>=2.7",
    "pre-commit>=3.7",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "types-defusedxml>=0.7.0.20260504",
    "types-PyYAML>=6.0",
]

[project.scripts]
nifbot = "nifbot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nifbot"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"tests/fakes_web.py" = ["E501"]  # fixture mirrors NSE's long CSV header verbatim

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# pandas-stubs false positives on .loc / DatetimeIndex attributes in test code
module = ["tests.unit.test_features", "tests.unit.test_feature_leakage", "tests.unit.test_cli_features"]
disable_error_code = ["index", "attr-defined", "arg-type"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=nifbot --cov-report=term-missing"

[tool.bandit]
exclude_dirs = ["tests"]
